# ==============================================================================
# RetroPie / RetroArch GameCube USB Pad Auto-Configuration Profile
# Matches Nintendo GameCube Controller Adapter for Wii U & PC / Mayflash
# ==============================================================================
input_driver = "udev"
input_device = "Mayflash / Official GameCube Controller Adapter"
input_vendor_id = "121"
input_product_id = "6172"

# Face Buttons
input_b_btn = "1"
