input_r2_axis = "+5"
input_z_btn = "7"

# Menu & Hotkeys
input_select_btn = "8"
input_start_btn = "9"
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"

# D-Pad
input_up_btn = "12"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "13"

# Analog Main Stick
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"

# C-Stick
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
